<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kazipur SSC · Profile</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&display=swap');

:root{
  /* Custom palette: #658abf #28382a #b3c1db #030402 */
  --paper:#e9edf5;        /* airy light tint of the blue-gray */
  --paper2:#b3c1db;       /* pale blue-gray surfaces / panels */
  --ink:#030402;          /* near-black text */
  --sub:#566270;          /* muted slate for secondary text */
  --line:#b3c1db;         /* pale blue-gray borders */
  --river:#658abf;        /* steel blue (primary accent) */
  --river-soft:#85a3cc;   /* lighter blue */
  --leaf:#28382a;         /* deep green (labels / school names) */
  --leaf-soft:#3f5642;
  --sand:#28382a;         /* deep green for small labels */
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; color:var(--ink);
  background:var(--paper);
  background-image:
    radial-gradient(1200px 400px at 80% -10%, rgba(101,138,191,.16), transparent 60%),
    radial-gradient(900px 360px at -10% 5%, rgba(179,193,219,.30), transparent 60%);
  font-family:'DM Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
}
.fr{font-family:'Fraunces',Georgia,serif;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px 80px;}

/* nav */
header.site{position:sticky;top:0;z-index:20;background:rgba(242,243,233,.86);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.nav-inner{max-width:1180px;margin:0 auto;padding:16px 22px;display:flex;
  align-items:center;justify-content:space-between;}
.brand{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;}
.brand span{color:var(--river);}
.brand .leaf{width:20px;height:20px;flex:none;}
.nav-links{display:flex;gap:28px;font-size:15px;font-weight:500;}
.navlink{position:relative;color:var(--sub);cursor:pointer;}
.navlink.active{color:var(--ink);}
.navlink::after{content:'';position:absolute;left:0;bottom:-4px;height:2px;width:0;
  background:var(--river);transition:width .3s;}
.navlink:hover::after,.navlink.active::after{width:100%;}

/* animations */
.lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;}
.lift:hover{transform:translateY(-6px);box-shadow:0 22px 40px -24px rgba(28,42,36,.5);}
.reveal{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes sway{0%,100%{transform:rotate(-1.5deg);}50%{transform:rotate(1.5deg);}}

/* home */
.eyebrow{color:var(--sand);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:12px;margin-bottom:18px;}
h1.hero{font-family:'Fraunces',serif;font-size:clamp(40px,7vw,76px);line-height:1.03;font-weight:600;letter-spacing:-.02em;margin:0;max-width:780px;}
h1.hero em{font-style:italic;color:var(--river);}
.lede{font-size:18px;color:var(--sub);max-width:560px;margin-top:22px;line-height:1.6;}
.btn-row{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap;}
.btn{padding:14px 26px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;}
.btn-primary{background:var(--river);color:#fff;}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--leaf);}

/* riverside illustration */
.scene{margin-top:46px;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 60px -40px rgba(28,42,36,.5);}
.scene svg{display:block;width:100%;height:auto;}
.scene .tree{transform-origin:bottom center;animation:sway 6s ease-in-out infinite;}
.scene .tree.b{animation-duration:7.5s;}
.scene .tree.c{animation-duration:5.2s;}

.stats{display:flex;gap:40px;margin-top:56px;flex-wrap:wrap;}
.stat-n{font-size:46px;font-weight:600;line-height:1;color:var(--river);}
.stat-l{color:var(--sub);font-size:14px;margin-top:6px;}
.panel{margin-top:60px;background:var(--paper2);border:1px solid var(--line);border-radius:18px;padding:26px;max-width:720px;}
.panel h3{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin:0 0 6px;}
.panel p{color:var(--sub);font-size:14px;line-height:1.6;margin:0 0 14px;}
.connect{display:flex;gap:10px;flex-wrap:wrap;}
.connect input{flex:1;min-width:240px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);font-size:14px;background:#fff;font-family:inherit;}
.connect .btn{background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;}
.status{margin-top:12px;font-size:13px;color:var(--sub);}

/* section heads */
.head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:28px;padding-top:48px;}
.head h2{font-family:'Fraunces',serif;font-size:40px;font-weight:600;margin:0;letter-spacing:-.02em;}
.head p{color:var(--sub);margin:6px 0 0;font-size:15px;}
.search{padding:11px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:#fff;min-width:250px;font-family:inherit;}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;}
.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);display:block;}
.card-photo{aspect-ratio:4/3;background:var(--paper2);overflow:hidden;}
.card-body{padding:16px 18px 20px;}
.card-name{font-size:21px;font-weight:600;letter-spacing:-.01em;}
.card-school{color:var(--leaf);font-size:13.5px;font-weight:600;margin-top:6px;}
.card-loc{color:var(--sub);font-size:13.5px;margin-top:3px;}
.avatar{width:100%;height:100%;display:grid;place-items:center;font-family:'Fraunces',serif;font-size:40px;color:var(--river-soft);background:var(--paper2);}
.empty{color:var(--sub);text-align:center;padding:60px;grid-column:1/-1;}

/* detail */
.back{color:var(--sub);font-size:14px;font-weight:500;display:inline-block;margin:36px 0 0;}
.detail-grid{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:44px;margin-top:24px;align-items:start;}
.detail-photo{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#fff;position:sticky;top:90px;aspect-ratio:3/4;}
.detail-name{font-size:clamp(34px,5vw,56px);font-weight:600;margin:0;line-height:1.05;letter-spacing:-.02em;}
.detail-school{color:var(--leaf);font-size:16px;font-weight:600;margin-top:12px;}
.detail-loc{color:var(--sub);font-size:16px;margin-top:4px;}
.fields{margin-top:30px;}
.field{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);}
.field-label{color:var(--sub);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;padding-top:2px;}
.field-value{font-size:16px;line-height:1.6;}

/* gallery */
.gallery{columns:240px;column-gap:16px;}
.g-item{break-inside:avoid;margin-bottom:16px;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--line);display:block;}
.g-item img{width:100%;display:block;}
.g-name{position:absolute;left:14px;bottom:12px;color:#fff;font-size:18px;font-weight:600;z-index:2;}
.g-item::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(28,42,36,.72),transparent 55%);}

footer.site{border-top:1px solid var(--line);padding:26px 22px;text-align:center;color:var(--sub);font-size:13px;}

@media(max-width:680px){
  .detail-grid{grid-template-columns:1fr;}
  .detail-photo{position:static;max-width:320px;}
  .field{grid-template-columns:1fr;gap:2px;}
}

/* hero layout + flowing gallery */
.hero-wrap{display:grid;grid-template-columns:1fr minmax(280px,440px);gap:46px;align-items:center;}
.hero-text{min-width:0;}
.hero-gallery{min-width:0;}
.flow-item{display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--paper2);position:relative;}
.flow-item img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;transition:transform .45s;}
.flow-item:hover img{transform:scale(1.06);}
.flow-item .fname{position:absolute;left:9px;bottom:8px;right:9px;color:#fff;font-family:'Fraunces',serif;font-size:13px;font-weight:600;z-index:2;line-height:1.15;}
.flow-item::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(3,4,2,.72),transparent 55%);}
/* desktop: two vertical streams */
.flow-desktop{display:block;height:520px;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent);
          mask-image:linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent);}
.flow-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%;}
.flow-col{display:block;animation:flowUp 26s linear infinite;will-change:transform;}
.flow-col.down{animation:flowDown 32s linear infinite;}
.flow-desktop .flow-item{margin-bottom:14px;}
.flow-desktop:hover .flow-col{animation-play-state:paused;}
@keyframes flowUp{from{transform:translateY(0);}to{transform:translateY(-50%);}}
@keyframes flowDown{from{transform:translateY(-50%);}to{transform:translateY(0);}}
/* mobile: one horizontal stream */
.flow-mobile{display:none;overflow:hidden;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 6%,#000 94%,transparent);
          mask-image:linear-gradient(to right,transparent,#000 6%,#000 94%,transparent);}
.flow-row{display:flex;width:max-content;animation:flowLeft 28s linear infinite;will-change:transform;}
.flow-mobile .flow-item{width:140px;flex:none;margin-right:12px;}
.flow-mobile:hover .flow-row{animation-play-state:paused;}
@keyframes flowLeft{from{transform:translateX(0);}to{transform:translateX(-50%);}}

@media(max-width:860px){
  .hero-wrap{grid-template-columns:1fr;gap:30px;}
  .flow-desktop{display:none;}
  .flow-mobile{display:block;}
}
@media(prefers-reduced-motion:reduce){
  .flow-col,.flow-row{animation:none;}
}

/* photo-only gallery items + lightbox */
.ph{break-inside:avoid;margin-bottom:16px;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--line);background:var(--paper2);cursor:zoom-in;}
.ph img{width:100%;display:block;transition:transform .45s;}
.ph:hover img{transform:scale(1.04);}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:14px;color:#fff;font-size:14px;font-weight:500;z-index:2;line-height:1.3;}
.ph.has-cap::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(3,4,2,.72),transparent 52%);}
.gallery-setup{max-width:560px;padding:24px 0;color:var(--sub);font-size:15px;line-height:1.6;}
.gallery-setup .gs-title{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--ink);margin:0 0 8px;}
.gallery-setup code{background:var(--paper2);padding:1px 6px;border-radius:5px;font-size:13px;}
.lb{position:fixed;inset:0;background:rgba(3,4,2,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:24px;}
.lb.open{display:flex;}
.lb img{max-width:92vw;max-height:84vh;border-radius:10px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);}
.lb .cap{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#fff;font-size:15px;padding:0 24px;}
.lb .x{position:absolute;top:16px;right:22px;background:none;border:none;color:#fff;font-size:34px;line-height:1;cursor:pointer;}

  </style>
</head>
<body>
  <header class="site">
    <div class="nav-inner">
      <a class="brand" href="index.html">Kazipur&nbsp;<span>SSC</span></a>
      <nav class="nav-links">
        <a class="navlink" href="index.html">Home</a>
        <a class="navlink active" href="people.html">People</a>
        <a class="navlink" href="gallery.html">Gallery</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="detail"></main>

  <footer class="site">Kazipur SSC Connect &middot; for the students of the river town</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script>
/* ============================================================
   CONFIG — connect your Google Sheet here.
   ------------------------------------------------------------
   1. In Google Sheets:  File ▸ Share ▸ Publish to web
   2. Choose the tab, pick "Comma-separated values (.csv)"
   3. Paste the link below (it ends in output=csv).
      You can also paste it in the box on the Home page —
      that gets remembered in your browser across all pages.

   Leave "" to use the built-in demo data.
   First row of the sheet = column headers. Recommended:
       Name | School | Location | Photo | Bio | DOB | Phone | Email
   Any extra column automatically shows on the full-info page.
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS5JgCAX605yDdni1C8qsbFrY0Ad12eIG_0ZpA5BaRUgopzpW4ET93Ia9rT1PGmuDjJvvfDp6NPM-XV/pub?output=csv";

/* The Gallery page is a separate photo-only album. Put a SECOND tab named
   "Gallery" in the same spreadsheet with a "Photo" column (and optional
   "Caption"), publish the whole document, and paste that tab's CSV link here:
   ...pub?gid=<TAB_GID>&single=true&output=csv   (see the README on how to find the gid) */
const GALLERY_CSV_URL = "";

/* ---------- Demo data (used when no sheet is connected) ---------- */
const DEMO = [
  { Name: "Amelia Rahman", School: "Kazipur Pilot High School", Location: "Kazipur Sadar", Photo: "https://i.pravatar.cc/600?img=47", Bio: "Loves photography and the riverbank at sunset. Studying architecture.", "SSC Batch": "2018", Phone: "+880 1700-000001", Email: "amelia@example.com" },
  { Name: "Tanvir Hasan", School: "Gandail High School", Location: "Gandail", Photo: "https://i.pravatar.cc/600?img=12", Bio: "Football, chess, and questionable puns.", "SSC Batch": "2017", Phone: "+880 1700-000002", Email: "tanvir@example.com" },
  { Name: "Sara Iqbal", School: "Natuarpara High School", Location: "Natuarpara", Photo: "https://i.pravatar.cc/600?img=32", Bio: "Debater and amateur baker.", "SSC Batch": "2019", Phone: "+880 1700-000003", Email: "sara@example.com" },
  { Name: "Rafiq Chowdhury", School: "Sonamukhi High School", Location: "Sonamukhi", Photo: "https://i.pravatar.cc/600?img=68", Bio: "Cricket statistics enthusiast.", "SSC Batch": "2016", Phone: "+880 1700-000004", Email: "rafiq@example.com" },
  { Name: "Nadia Sultana", School: "Maijbari High School", Location: "Maijbari", Photo: "https://i.pravatar.cc/600?img=45", Bio: "Painter. Tea over coffee, always.", "SSC Batch": "2020", Phone: "+880 1700-000005", Email: "nadia@example.com" },
  { Name: "Imran Kabir", School: "Subhagacha High School", Location: "Subhagacha", Photo: "https://i.pravatar.cc/600?img=15", Bio: "Builds tiny robots by the river on weekends.", "SSC Batch": "2018", Phone: "+880 1700-000006", Email: "imran@example.com" },
];

/* ---------- Sheet URL persistence (works on a hosted site) ---------- */
function getSheetUrl() { try { return localStorage.getItem("sheetCsvUrl") || SHEET_CSV_URL; } catch (e) { return SHEET_CSV_URL; } }
function setSheetUrl(u) { try { localStorage.setItem("sheetCsvUrl", u); } catch (e) {} }
function clearSheetUrl() { try { localStorage.removeItem("sheetCsvUrl"); } catch (e) {} }

/* ---------- Helpers ---------- */
const PHOTO_KEYS = ["photo", "image", "picture", "pic"];

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function normalizeImage(url) {
  if (!url) return "";
  const m = String(url).match(/\/d\/([a-zA-Z0-9_-]+)/) || String(url).match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000`;
  return url;
}
function pick(row, keys, fallbacks = []) {
  const entries = Object.entries(row);
  for (const kw of keys) {
    const hit = entries.find(([k]) => k.toLowerCase().trim() === kw);
    if (hit && hit[1]) return hit[1];
  }
  for (const kw of [...keys, ...fallbacks]) {
    const hit = entries.find(([k]) => k.toLowerCase().includes(kw));
    if (hit && hit[1]) return hit[1];
  }
  return "";
}
// Like pick(), but returns the matching HEADER name (so we can hide it elsewhere).
function matchedKey(row, keys, fallbacks = []) {
  const entries = Object.entries(row);
  for (const kw of keys) {
    const hit = entries.find(([k]) => k.toLowerCase().trim() === kw);
    if (hit && hit[1]) return hit[0];
  }
  for (const kw of [...keys, ...fallbacks]) {
    const hit = entries.find(([k]) => k.toLowerCase().includes(kw));
    if (hit && hit[1]) return hit[0];
  }
  return null;
}
function shape(row) {
  return {
    name: pick(row, ["name"], ["full"]),
    school: pick(row, ["school"], ["college", "institution"]),
    location: pick(row, ["location"], ["address", "place", "area"]),
    photo: normalizeImage(pick(row, ["photo", "image", "picture", "pic"])),
    raw: row,
  };
}
function initials(name) {
  return (name || "?").split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
}

/* ---------- Load people, then call cb(people, status) ---------- */
function loadPeople(cb) {
  const url = getSheetUrl();
  if (!url) { cb(DEMO.map(shape), "demo"); return; }
  Papa.parse(url, {
    download: true, header: true, skipEmptyLines: true,
    complete: (res) => {
      const rows = res.data.filter((r) => Object.values(r).some((v) => v && String(v).trim()));
      if (!rows.length) { cb(DEMO.map(shape), "error"); return; }
      cb(rows.map(shape), "live");
    },
    error: () => cb(DEMO.map(shape), "error"),
  });
}

/* ---------- Reusable HTML bits ---------- */
function photoBox(p, ratio) {
  if (p.photo) return `<img src="${esc(p.photo)}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:cover;">`;
  return `<div class="avatar" style="aspect-ratio:${ratio}">${esc(initials(p.name))}</div>`;
}
function cardHTML(p, i) {
  return `<a class="card lift reveal" href="person.html?i=${i}" style="animation-delay:${(i % 12) * 0.04}s">
    <div class="card-photo">${photoBox(p, "4/3")}</div>
    <div class="card-body">
      <div class="card-name fr">${esc(p.name) || "Unnamed"}</div>
      <div class="card-school">${esc(p.school) || "—"}</div>
      <div class="card-loc">📍 ${esc(p.location) || "—"}</div>
    </div>
  </a>`;
}

/* ---------- Page renderers ---------- */
function renderDirectory(listId, countId, searchId) {
  loadPeople((people) => {
    const list = document.getElementById(listId);
    const count = document.getElementById(countId);
    const search = document.getElementById(searchId);
    function draw(items) {
      list.innerHTML = items.length
        ? items.map((p) => cardHTML(p, people.indexOf(p))).join("")
        : `<p class="empty">No matches.</p>`;
      if (count) count.textContent = `${items.length} of ${people.length} shown · tap a card for the full profile`;
    }
    draw(people);
    if (search) search.addEventListener("input", () => {
      const q = search.value.toLowerCase().trim();
      draw(!q ? people : people.filter((p) => [p.name, p.school, p.location].join(" ").toLowerCase().includes(q)));
    });
  });
}

function renderGallery(listId, countId) {
  loadPeople((people) => {
    const withPhotos = people.filter((p) => p.photo);
    const list = document.getElementById(listId);
    document.getElementById(countId).textContent = `${withPhotos.length} portraits · tap to open a profile`;
    list.innerHTML = withPhotos.length
      ? withPhotos.map((p) => `<a class="g-item lift reveal" href="person.html?i=${people.indexOf(p)}">
          <img src="${esc(p.photo)}" alt="${esc(p.name)}">
          <span class="g-name fr">${esc(p.name)}</span>
        </a>`).join("")
      : `<p class="empty">No photos yet — add image links in your sheet's Photo column.</p>`;
  });
}

function renderDetail(rootId) {
  loadPeople((people) => {
    const params = new URLSearchParams(location.search);
    let p = null;
    if (params.has("i")) p = people[parseInt(params.get("i"), 10)];
    if (!p && params.has("name")) p = people.find((x) => x.name.toLowerCase() === params.get("name").toLowerCase());
    const root = document.getElementById(rootId);
    if (!p) { root.innerHTML = `<p class="empty">Person not found. <a href="people.html">Back to people →</a></p>`; return; }

    const schoolKey = matchedKey(p.raw, ["school"], ["college", "institution"]);
    const locKey = matchedKey(p.raw, ["location"], ["address", "place", "area"]);
    const skip = new Set([schoolKey, locKey].filter(Boolean));
    Object.keys(p.raw).forEach((k) => { if (PHOTO_KEYS.some((kw) => k.toLowerCase().includes(kw))) skip.add(k); });
    const fields = Object.entries(p.raw).filter(([k, v]) => v && String(v).trim() && !skip.has(k) && k.toLowerCase().trim() !== "name");

    root.innerHTML = `
      <a class="back navlink" href="people.html">← Back to people</a>
      <div class="detail-grid">
        <div class="detail-photo">${photoBox(p, "3/4")}</div>
        <div>
          <h1 class="fr detail-name">${esc(p.name)}</h1>
          <div class="detail-school">${esc(p.school)}</div>
          <div class="detail-loc">📍 ${esc(p.location)}</div>
          <div class="fields">
            ${fields.map(([k, v]) => `<div class="field">
              <div class="field-label">${esc(k)}</div>
              <div class="field-value">${esc(v)}</div>
            </div>`).join("")}
          </div>
        </div>
      </div>`;
  });
}

/* ---------- Photo-only Gallery (separate "Gallery" tab) ---------- */
function getGalleryUrl() { try { return localStorage.getItem("galleryCsvUrl") || GALLERY_CSV_URL; } catch (e) { return GALLERY_CSV_URL; } }

function loadGallery(cb) {
  const url = getGalleryUrl();
  if (!url) { cb(null, "unset"); return; }
  Papa.parse(url, {
    download: true, header: true, skipEmptyLines: true,
    complete: (res) => {
      const rows = res.data.filter((r) => Object.values(r).some((v) => v && String(v).trim()));
      const photos = rows.map((r) => ({
        photo: normalizeImage(pick(r, ["photo", "image", "picture", "pic"])),
        caption: pick(r, ["caption", "title", "description", "desc"]),
      })).filter((p) => p.photo);
      cb(photos, "live");
    },
    error: () => cb(null, "error"),
  });
}

function ensureLightbox() {
  let lb = document.getElementById("kz-lb");
  if (lb) return lb;
  lb = document.createElement("div");
  lb.id = "kz-lb"; lb.className = "lb";
  lb.innerHTML = '<button class="x" aria-label="Close">&times;</button><img alt=""><div class="cap"></div>';
  document.body.appendChild(lb);
  const close = () => lb.classList.remove("open");
  lb.addEventListener("click", (e) => { if (e.target === lb || e.target.classList.contains("x")) close(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  return lb;
}

function renderGalleryPhotos(listId, countId) {
  const list = document.getElementById(listId);
  const count = document.getElementById(countId);
  loadGallery((photos, status) => {
    if (status === "unset") {
      count.textContent = "";
      list.innerHTML = '<div class="gallery-setup">' +
        '<p class="gs-title">Set up your photo gallery</p>' +
        '<p>Add a tab called <b>Gallery</b> to your spreadsheet with a <b>Photo</b> column (and an optional <b>Caption</b>), one row per image. Publish the whole document, then paste that tab&rsquo;s CSV link into <code>GALLERY_CSV_URL</code> at the top of the script in <code>gallery.html</code>.</p></div>';
      return;
    }
    if (status === "error" || !photos || !photos.length) {
      count.textContent = "";
      list.innerHTML = '<p class="empty">Couldn&rsquo;t load gallery photos. Make sure the Gallery tab is published as CSV.</p>';
      return;
    }
    count.textContent = photos.length + (photos.length === 1 ? " photo" : " photos");
    list.innerHTML = photos.map((p, i) =>
      `<div class="ph${p.caption ? " has-cap" : ""}" data-i="${i}"><img src="${esc(p.photo)}" alt="${esc(p.caption || "")}" loading="lazy">${p.caption ? `<div class="cap">${esc(p.caption)}</div>` : ""}</div>`
    ).join("");
    const lb = ensureLightbox();
    list.addEventListener("click", (e) => {
      const ph = e.target.closest(".ph");
      if (!ph) return;
      const p = photos[parseInt(ph.dataset.i, 10)];
      lb.querySelector("img").src = p.photo;
      lb.querySelector(".cap").textContent = p.caption || "";
      lb.classList.add("open");
    });
  });
}

/* ---------- Hero flowing gallery (home page) ---------- */
function renderHeroGallery(id) {
  const box = document.getElementById(id);
  if (!box) return;
  loadPeople((people) => {
    const ppl = people.filter((p) => p.photo);
    if (!ppl.length) { box.style.display = "none"; return; }
    const item = (p) => {
      const i = people.indexOf(p);
      return `<a class="flow-item" href="person.html?i=${i}"><img src="${esc(p.photo)}" alt="${esc(p.name)}" loading="lazy"><span class="fname">${esc(p.name)}</span></a>`;
    };
    const half = Math.ceil(ppl.length / 2);
    const colA = ppl.slice(0, half).map(item).join("");
    const colB = (ppl.slice(half).concat(ppl.slice(0, 1))).map(item).join("");
    const all = ppl.map(item).join("");
    box.innerHTML =
      `<div class="flow-desktop"><div class="flow-cols">
         <div class="flow-col">${colA}${colA}</div>
         <div class="flow-col down">${colB}${colB}</div>
       </div></div>
       <div class="flow-mobile"><div class="flow-row">${all}${all}</div></div>`;
  });
}

/* ---------- Home: stats + connect box ---------- */
function renderHome(statsId, statusId, inputId, btnId) {
  loadPeople((people, status) => {
    const stats = document.getElementById(statsId);
    if (stats) stats.innerHTML = [
      [people.length, "People listed"],
      [new Set(people.map((p) => p.school).filter(Boolean)).size, "Schools"],
      [new Set(people.map((p) => p.location).filter(Boolean)).size, "Locations"],
    ].map(([n, l]) => `<div class="stat"><div class="stat-n fr">${n}</div><div class="stat-l">${l}</div></div>`).join("");

    const statusEl = document.getElementById(statusId);
    const msg = {
      demo: "Showing demo data — connect a sheet to see your own people.",
      loading: "Loading from your sheet…",
      live: "✓ Live data loaded from your sheet.",
      error: "Couldn't read that link. Make sure it's published as CSV and ends in output=csv.",
    };
    if (statusEl) { statusEl.textContent = msg[status]; statusEl.style.color = status === "error" ? "#b4453f" : "#566270"; }

    const input = document.getElementById(inputId);
    if (input) input.value = getSheetUrl();
    const btn = document.getElementById(btnId);
    if (btn) btn.addEventListener("click", () => {
      const v = input.value.trim();
      if (v) setSheetUrl(v); else clearSheetUrl();
      location.reload();
    });
  });
}
